name: Build tvOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned tvOS app
        run: |
          set -euxo pipefail
          xcodebuild \
            -project rezka-player.xcodeproj \
            -scheme rezka-player \
            -configuration Release \
            -sdk appletvos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-appletvos" -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p Payload artifact
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload artifact/rezka-player-tvOS-unsigned.ipa
          unzip -l artifact/rezka-player-tvOS-unsigned.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: rezka-player-tvOS-unsigned
          path: artifact/rezka-player-tvOS-unsigned.ipa
          if-no-files-found: error
